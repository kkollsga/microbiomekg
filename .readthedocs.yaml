# Read the Docs configuration file. The remote exists; what remains is the
# project on readthedocs.org, which the repo's owner connects
# (docs/design/release-readiness.md §5). The intended slug is `microbiomekg`,
# so the docs URL is https://microbiomekg.readthedocs.io — RTD suffixes a slug
# that is taken, so the real one is confirmed after the project is created.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
