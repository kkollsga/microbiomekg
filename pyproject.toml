# The package: pure Python on the kglite wheel. The licence covers the code
# only — no data and no built graph ships, because 26% of evidence-bearing
# edges have no redistribution permission (docs/evaluation.md §4). Nothing is
# published yet: the version is a placeholder until the release train reaches
# PyPI (docs/design/release-readiness.md §4), and there are no project URLs
# because there is no remote to point at (§1).
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "microbiomekg"
version = "0.1.0"
description = "A microbiome knowledge graph on kglite, with the evidence model as the point."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kristian dF Kollsgård"}
]
keywords = [
    "microbiome", "knowledge-graph", "cypher", "kglite", "evidence",
    "bugsigdb", "ncbi-taxonomy", "mcp", "llm-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "kglite>=0.16.23",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]
docs = [
    "sphinx>=8.1.3",
    "furo",
    "myst-parser",
    "sphinx-autoapi",
    "sphinx-copybutton",
]

[project.scripts]
microbiomekg = "microbiomekg.cli:main"

# The blueprint fragments and the MCP manifest + skills are data inside the
# package directory; hatchling ships everything under it that git tracks, so
# adding a source's fragment is adding a file, never editing this.
[tool.hatch.build.targets.wheel]
packages = ["microbiomekg"]

[tool.hatch.build.targets.sdist]
include = [
    "microbiomekg/**",
    "scripts/**",
    "tests/**",
    "docs/**",
    ".readthedocs.yaml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test carries a hang ceiling. A test that hits it is a FAILED test —
# fix the hang, never raise the ceiling. The whole suite runs against a
# 42-row fixture, so nothing here should take more than a second; the
# ceiling exists to catch a promotion loop that never terminates (see
# docs/usecases-and-pitfalls.md C8, where root is its own parent).
timeout = 120
timeout_method = "thread"
addopts = "-ra --strict-markers"
markers = [
    "fixture: asserts a property of the checked-in fixture itself, not of the implementation",
]
filterwarnings = [
    "default",
]

[tool.ruff]
# The gate must mean the same thing next month. ruff's implicit defaults move
# between releases — 0.14 reported 9 findings on this tree where 0.16 reported
# 308, none of them a new defect — so the rule set is pinned here rather than
# inherited, and widening it is a deliberate change with its own commit.
line-length = 88
target-version = "py311"
extend-exclude = ["data", "graph", ".venv"]

[tool.ruff.lint]
# ruff's documented default set: pyflakes (F) plus the pycodestyle subsets that
# catch real errors rather than layout opinions, which `ruff format` owns.
select = ["E4", "E7", "E9", "F"]
